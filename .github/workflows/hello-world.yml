
name: Auto Append Hello World

on:
  schedule:
    - cron: '0 */4 1-31/4 * *'
      timezone: 'Asia/Jakarta'
    - cron: '0 0,12 2-31/4 * *'
      timezone: 'Asia/Jakarta'
    - cron: '0 0,8,16 3-31/4 * *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hello-world-main
  cancel-in-progress: false

jobs:
  append-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Append Hello World
        run: |
          echo "Hello World" >> "Hello World.txt"

      - name: Commit and Push to Main
        run: |
          git config user.name "mfarrasmajid"
          git config user.email "47713041+mfarrasmajid@users.noreply.github.comm"

          git add "Hello World.txt"
          git commit -m "Auto append Hello World"
          git push origin HEAD:main
